name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Python tests (CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: System libraries (OpenCV, WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libpango-1.0-0 libpangoft2-1.0-0
      - name: Install from uv.lock (CPU PyTorch wheels keep the runner small)
        run: |
          uv lock --check
          # everything pinned from the lock except the CUDA build of torch: CI uses the CPU wheels
          uv export --frozen --extra dev --no-hashes --no-emit-project \
            | grep -vE '^(torch|torchvision|triton|nvidia-)' > constraints.txt
          uv venv .venv --python 3.12
          TORCH=$(uv export --frozen --no-hashes --no-emit-project | grep -E '^torch==' | cut -d= -f3 | cut -d' ' -f1)
          VISION=$(uv export --frozen --no-hashes --no-emit-project | grep -E '^torchvision==' | cut -d= -f3 | cut -d' ' -f1)
          uv pip install --python .venv/bin/python "torch==${TORCH}+cpu" "torchvision==${VISION}+cpu" \
            --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match
          uv pip install --python .venv/bin/python -e ".[dev]" -c constraints.txt
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Unit tests
        run: .venv/bin/python -m pytest -m "not gpu and not integration" -q -o addopts="" -p no:cacheprovider --timeout=120 --durations=15
      - name: Quickstart notebook runs
        run: .venv/bin/jupyter nbconvert --to notebook --execute --stdout notebooks/quickstart.ipynb > /dev/null

  frontend:
    name: Frontend (types + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
